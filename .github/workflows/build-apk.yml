name: Build and Release Android APK

on:
  push:
    branches:
      - development/molido-vpn-ai-from-scratch
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Test, build and publish MolidoVPN APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MOLIDO_VERSION_CODE: ${{ github.run_number }}
      MOLIDO_VERSION_NAME: 1.1.${{ github.run_number }}
      # Base64 X.509 (DER) ECDSA P-256 public key embedded in the APK; empty = auto-update off.
      MOLIDO_UPDATE_PUBLIC_KEY: ${{ secrets.MOLIDO_UPDATE_PUBLIC_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests and lint
        run: gradle --no-daemon :android:app:testDebugUnitTest :android:app:lintDebug

      - name: Build APK (signed release if secrets exist, else debug)
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          OUT="MolidoVPN-v${MOLIDO_VERSION_NAME}.apk"
          if [ -n "${KS_B64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/molido-release.p12"
            printf '%s' "$KS_B64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            export ANDROID_KEYSTORE_FILE="$KEYSTORE_PATH"
            export ANDROID_KEY_ALIAS="$KS_ALIAS"
            printf -v ANDROID_KEYSTORE_PASSWORD '%s' "$KS_PASS"; export ANDROID_KEYSTORE_PASSWORD
            printf -v ANDROID_KEY_PASSWORD '%s' "$KS_KEYPASS"; export ANDROID_KEY_PASSWORD
            gradle --no-daemon :android:app:assembleRelease
            cp android/app/build/outputs/apk/release/app-release.apk "$OUT"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Release keystore secrets missing - publishing a DEBUG pre-release (in-app auto-update will reject it)."
            gradle --no-daemon :android:app:assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi
          sha256sum "$OUT" > "$OUT.sha256"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_SIGNING_KEY_B64: ${{ secrets.MOLIDO_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" != "true" ] || [ -z "${UPDATE_SIGNING_KEY_B64:-}" ] || [ -z "${MOLIDO_UPDATE_PUBLIC_KEY:-}" ]; then
            echo "::warning::Update signing key or release keystore missing - no update-manifest.json published."
            exit 0
          fi
          KEY="$RUNNER_TEMP/update-signing.pem"
          PUB="$RUNNER_TEMP/update-public.der"
          printf '%s' "$UPDATE_SIGNING_KEY_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          printf '%s' "$MOLIDO_UPDATE_PUBLIC_KEY" | base64 --decode > "$PUB"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          EXP=$(( $(date +%s) + 90 * 86400 ))
          # Must match UpdateIntegrityCore.canonicalPayload: "versionCode\nexpiresAt\nsha256\n"
          printf '%s\n%s\n%s\n' "$MOLIDO_VERSION_CODE" "$EXP" "$SHA" > "$RUNNER_TEMP/payload.txt"
          openssl dgst -sha256 -sign "$KEY" -out "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/payload.txt"
          # Self-check against the embedded public key before publishing.
          openssl dgst -sha256 -verify "$PUB" -keyform DER -signature "$RUNNER_TEMP/sig.der" "$RUNNER_TEMP/payload.txt"
          SIG=$(base64 -w0 "$RUNNER_TEMP/sig.der")
          printf '{"versionCode":%s,"expiresAt":%s,"sha256":"%s","apk":"%s","signature":"%s"}\n' \
            "$MOLIDO_VERSION_CODE" "$EXP" "$SHA" "$APK" "$SIG" > update-manifest.json
          rm -f "$KEY"
          cat update-manifest.json

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MolidoVPN-Android-APK
          path: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.MOLIDO_VERSION_NAME }}
          name: MolidoVPN v${{ env.MOLIDO_VERSION_NAME }}
          prerelease: ${{ env.SIGNED != 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            ${{ env.APK }}
            ${{ env.APK }}.sha256
            update-manifest.json
