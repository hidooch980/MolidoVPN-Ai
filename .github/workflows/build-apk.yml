name: Build and Release Android APK

on:
  push:
    branches:
      - development/molido-vpn-ai-from-scratch
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build MolidoVPN Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android Debug APK
        run: |
          gradle --no-daemon :android:app:assembleDebug
          cp android/app/build/outputs/apk/debug/app-debug.apk MolidoVPN-v1.0.0.apk

      - name: Upload APK as Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MolidoVPN-Android-APK
          path: MolidoVPN-v1.0.0.apk
          retention-days: 30
