name: Android CI

on:
  push:
    branches:
      - development/molido-vpn-ai-from-scratch
  pull_request:
    branches:
      - development/molido-vpn-ai-from-scratch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :android:app:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/test attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1
      - name: Run Android lint (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :android:app:lintDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle lint attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1
      - name: Assemble release variant (CI validation only; never distributed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :android:app:assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle release-assembly attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1

  backend:
    name: Test self-hosted control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/tests


  android-keystore-instrumentation:
    name: Android Keystore instrumentation (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Android Keystore instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: gradle --no-daemon :android:app:connectedDebugAndroidTest
