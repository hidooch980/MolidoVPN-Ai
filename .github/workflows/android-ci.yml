name: Android CI

on:
  push:
    branches:
      - development/molido-vpn-ai-from-scratch
      - feature/optional-warp-wireguard-enrollment
  pull_request:
    branches:
      - development/molido-vpn-ai-from-scratch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Android source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :android:app:testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/test attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1
      - name: Run Android lint (retry transient repository failures)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :android:app:lintDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle lint attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1
      - name: Assemble release variant (CI validation only; never distributed)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :android:app:assembleRelease; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle release-assembly attempt $attempt failed; retrying after 15 seconds."
              sleep 15
            fi
          done
          exit 1


  backend:
    name: Test self-hosted control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q backend/tests

  android-keystore-instrumentation:
    name: Android Keystore instrumentation (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: "60"
      # GitHub-hosted runners may not expose KVM; explicitly allow QEMU TCG.
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install emulator image and create AVD
        shell: bash
        run: |
          set -euo pipefail
          # Keep pipefail for later commands, but let sdkmanager determine the license step status.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

          # Pin AVD creation and emulator lookup to the same explicit directory.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo "no" | avdmanager create avd \
            --name molido-ci-api35 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device pixel_2
          test -s "$ANDROID_AVD_HOME/molido-ci-api35.ini"
          test -d "$ANDROID_AVD_HOME/molido-ci-api35.avd"
          avdmanager list avd
      - name: Boot emulator with software acceleration
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          adb start-server
          EMULATOR_BIN="${ANDROID_HOME:-/usr/local/lib/android/sdk}/emulator/emulator"
          if [ ! -x "$EMULATOR_BIN" ]; then
            echo "Android Emulator binary is missing or not executable: $EMULATOR_BIN"
            find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 3 -type f -name emulator -print || true
            exit 1
          fi
          nohup "$EMULATOR_BIN" -avd molido-ci-api35 \
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio \
            -no-boot-anim -camera-back none -no-metrics -accel off \
            > "$RUNNER_TEMP/molido-emulator.log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/molido-emulator.pid"

          # Bound the ADB transport wait: adb wait-for-device otherwise has no
          # deadline and can keep this step alive without ever reaching boot checks.
          if ! timeout 120s adb wait-for-device; then
            echo "ADB did not detect the emulator within 120 seconds."
            tail -n 250 "$RUNNER_TEMP/molido-emulator.log" || true
            exit 1
          fi

          booted=0
          for attempt in $(seq 1 900); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Emulator process exited before Android completed boot."
              tail -n 250 "$RUNNER_TEMP/molido-emulator.log" || true
              exit 1
            fi
            state="$(timeout 15s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$state" = "1" ]; then
              booted=1
              break
            fi
            if [ $((attempt % 30)) -eq 0 ]; then
              echo "Waiting for Android boot: ${attempt}s elapsed."
              adb devices -l || true
              tail -n 60 "$RUNNER_TEMP/molido-emulator.log" || true
            fi
            sleep 1
          done
          if [ "$booted" -ne 1 ]; then
            echo "Emulator did not complete boot within 900 seconds."
            tail -n 250 "$RUNNER_TEMP/molido-emulator.log" || true
            exit 1
          fi
          timeout 15s adb shell getprop ro.build.version.sdk
          timeout 15s adb shell getprop sys.boot_completed
          adb devices -l
      - name: Run Android Keystore instrumentation tests
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :android:app:connectedDebugAndroidTest
      - name: Collect emulator diagnostics on failure
        if: failure()
        shell: bash
        timeout-minutes: 5
        run: |
          set +e
          echo "=== ADB devices (15s limit) ==="
          timeout 15s adb devices -l || true
          echo "=== Android logcat (45s limit) ==="
          timeout 45s adb logcat -d -t 1200 || true
          echo "=== Emulator process log ==="
          if [ -f "$RUNNER_TEMP/molido-emulator.log" ]; then
            tail -n 300 "$RUNNER_TEMP/molido-emulator.log"
          else
            echo "Emulator log file was not created."
          fi
      - name: Stop emulator
        if: always()
        shell: bash
        run: |
          adb emu kill || true

  signed-release:
    name: Build and verify signed Android release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development/molido-vpn-ai-from-scratch'
    needs:
      - validate
      - backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Decode release keystore and build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          KEYSTORE_PATH="$RUNNER_TEMP/molido-release-keystore.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEYSTORE_FILE="$KEYSTORE_PATH"
          gradle --no-daemon :android:app:assembleRelease
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT_SHA256="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}')"
          KEY_CERT_SHA256="$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storetype PKCS12 -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" | sha256sum | awk '{print $1}')"
          if [ -z "$APK_CERT_SHA256" ] || [ "$APK_CERT_SHA256" != "$KEY_CERT_SHA256" ]; then
            echo "APK signing certificate does not match the configured release keystore."
            exit 1
          fi
          echo "APK signature verified and certificate fingerprint matches the configured keystore."
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: molido-vpn-android-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
