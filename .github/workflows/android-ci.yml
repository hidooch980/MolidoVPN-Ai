name: Android CI

on:
  push:
    branches:
      - development/molido-vpn-ai-from-scratch
  pull_request:
    branches:
      - development/molido-vpn-ai-from-scratch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Android source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle :android:app:testDebugUnitTest
      - name: Run Android lint
        run: gradle :android:app:lintDebug
      - name: Assemble release variant (CI validation only; never distributed)
        run: gradle :android:app:assembleRelease
